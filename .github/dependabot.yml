# Dependabot version updates. Every Dependabot pull request targets `main`
# (the repo is trunk-based; there is no `staging` branch).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Majors arrive only when someone chooses them (owner, 2026-11-12);
    # ignore never blocks security updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before Dependabot proposes it, so a hijacked
    # or broken release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    # Majors arrive only when someone chooses them (owner, 2026-11-12);
    # ignore never blocks security updates.
    # Until Astro and typescript-eslint support TS 7; remove then.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before Dependabot proposes it, so a hijacked
    # or broken release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
