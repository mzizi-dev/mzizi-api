name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in the
    # stack, and a filter of [main] silently gives every layer but the bottom
    # one zero checks — a green PR with nothing run looks identical to a
    # passing one.
    branches: [main, "claude/**"]
  # Required checks must also report on a merge queue's gh-readonly-queue/**
  # ref, or a queued PR waits until the queue times it out. Harmless where no
  # queue is configured.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Clones mzizi-registry at the ref pinned in scripts/registry-ref.json and
      # generates src/data/. Everything below reads it.
      - run: npm run build:data

      # tsc over the tsconfig program (src/, test/), as before.
      - run: npm run typecheck

      # vp check: oxfmt + oxlint + type-aware lint and type check, the org's
      # Vite+ standard (replaces the old prettier format:check).
      - run: npm run check

      - run: npm test

      # The TypeScript Worker's own bundle, from wrangler.ts.jsonc (the rollback
      # config; wrangler.jsonc now builds the Rust Worker, see the rust job). Fails
      # here if the bundle is over the size limit or the config is invalid — except
      # routes, which a dry run does not validate.
      - name: wrangler deploy --dry-run (TypeScript)
        run: npx wrangler deploy --dry-run -c wrangler.ts.jsonc --outdir=.wrangler/dryrun

  # The Rust Worker (mzizi-api#156): crates/mzizi-api-types and
  # crates/mzizi-api-worker. It is production (wrangler.jsonc) since the cutover,
  # and serves the same src/data/*.json as the TypeScript Worker (wrangler.ts.jsonc),
  # which the parity step below compares it against. It needs the data step first.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:data

      # The toolchain is pinned by rust-toolchain.toml: `rustup show` installs it
      # with its components and target on the runner's rustup, so no third-party
      # toolchain action is needed and CI builds with the same compiler as Workers Builds.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
          cargo --version

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      # The Workers glue (src/worker_glue.rs) only compiles for wasm32.
      - run: cargo clippy -p mzizi-api-worker --target wasm32-unknown-unknown --locked -- -D warnings

      - run: cargo test --locked

      # Publishable, never published from CI.
      - run: cargo publish --dry-run --locked -p mzizi-api-types

      - name: Install worker-build
        run: cargo install worker-build --version 0.9.0 --locked

      # wrangler's own bundle of the Rust Worker, with the custom build in
      # wrangler.rust.jsonc. Reports the upload size; fails over the limit.
      - name: wrangler deploy --dry-run (Rust)
        run: npx wrangler deploy --dry-run -c wrangler.rust.jsonc --outdir=.wrangler/dryrun-rust

      # The production config itself (wrangler.jsonc: the route, the account and the
      # Rust build). A dry run does not validate the route, which only the production
      # deploy does; see AGENTS.md.
      - name: wrangler deploy --dry-run (production, wrangler.jsonc)
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dryrun-prod

      # Both Workers side by side under wrangler dev, and parity between them:
      # every request parity makes must answer the same from each. The TypeScript
      # Worker is wrangler.ts.jsonc (port 8787), the Rust Worker wrangler.rust.jsonc
      # (port 8788). One after the other: both configs run a data build as their
      # custom build (scripts/build-rust.sh), and two copies writing src/data/ at once
      # can hand one of them a half-written file.
      - name: Start both Workers
        run: |
          wait_for() {
            for _ in $(seq 1 300); do
              curl -sf -o /dev/null "http://localhost:$1/v1/health" && return 0
              sleep 2
            done
            cat "$2"
            return 1
          }
          npx wrangler dev -c wrangler.ts.jsonc --port 8787 > wrangler-dev-ts.log 2>&1 &
          wait_for 8787 wrangler-dev-ts.log
          npx wrangler dev -c wrangler.rust.jsonc --port 8788 > wrangler-dev-rust.log 2>&1 &
          wait_for 8788 wrangler-dev-rust.log

      - name: Parity, TypeScript vs Rust
        run: |
          status=0
          node scripts/parity.mjs --strict --report parity-rust.md \
            --baseline http://localhost:8787 --candidate http://localhost:8788 || status=$?
          cat parity-rust.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks/gitleaks-action wrapper requires a paid licence for org
      # repos. The binary is MIT-licensed, so it runs directly and stays free.
      - name: Install gitleaks
        env:
          VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - run: gitleaks detect --source . --redact --no-banner --verbose
