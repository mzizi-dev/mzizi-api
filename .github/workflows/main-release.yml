# Versioning policy (nyuchi/.github#80): every release to `main` is the next
# MINOR (x.y.z -> x.(y+1).0); merges into `staging` are patches
# (staging-version.yml); a MAJOR is only ever made by hand, here, with
# workflow_dispatch and bump: major.
#
# Gated on CI: it runs after the `CI` workflow COMPLETES on `main` and only
# tags when it succeeded, so a red `main` gets no version. The version lives
# in tags only: nothing is committed back to `main`. The tag and release are
# pushed with the run's GITHUB_TOKEN, as the org's staging release does (the
# org RELEASE_BUMP_TOKEN is not used: nothing here listens for tag pushes, so
# a tag that starts no workflow is what we want). Copied from
# mukoko-dev/mukoko-circles .github/workflows/main-release.yml.
name: Main release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: version-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag the next minor
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Check out trusted main, never the workflow_run's commit, and tag the
        # tested commit by SHA below. fetch-depth 0 makes that commit, and the
        # tags the release notes compare against, present.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the next version
        id: v
        uses: nyuchi/.github/.github/actions/next-version@c2e2506a4eadf67fbf824b41720aa220c539fc21  # main, 2026-10-19
        with:
          channel: main
          bump: ${{ inputs.bump || '' }}
          manual: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Push the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          head="$(git rev-parse --verify "${SHA}^{commit}")"
          # A commit that already carries a minor tag keeps it. Its release is
          # created if missing; a manual run rewrites its notes; anything else
          # is a re-run with nothing to do.
          existing="$(git ls-remote --tags "$remote" 'refs/tags/v*' \
            | awk -v h="$head" '$1 == h && $2 ~ /\.0\^\{\}$/ { print $2; exit }')"
          existing="${existing#refs/tags/}"
          existing="${existing%^\{\}}"
          if [ -n "$existing" ]; then TAG="$existing"; fi
          # Release notes: the CHANGELOG.md entries added since the previous
          # main release, then GitHub's list of merged pull requests.
          prev="$(git tag -l 'v*.*.0' --merged "$head" --sort=-v:refname | grep -Fvx "$TAG" | head -n 1 || true)"
          CHANGELOG_URL="https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md" \
            python3 .github/scripts/release_notes.py "$prev" "$head" > "$RUNNER_TEMP/notes.md"
          start=()
          if [ -n "$prev" ]; then start=(-f "previous_tag_name=$prev"); fi
          if [ -n "$existing" ] && gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "$head is already released as $TAG."
              exit 0
            fi
            gh api "repos/${GH_REPO}/releases/generate-notes" -f "tag_name=$TAG" "${start[@]}" \
              --jq .body >> "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Rewrote the notes of $TAG from CHANGELOG.md." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$existing" ]; then
            git tag -a "$TAG" -m "$TAG" "$head"
            git push "$remote" "refs/tags/$TAG"
          fi
          gh api "repos/${GH_REPO}/releases/generate-notes" -f "tag_name=$TAG" "${start[@]}" \
            --jq .body >> "$RUNNER_TEMP/notes.md"
          # Immutable releases lock the tag and assets on publish: draft, then
          # publish once. Nothing re-uploads or moves the tag afterwards.
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --draft=false --latest
          echo "Released $TAG at $head." | tee -a "$GITHUB_STEP_SUMMARY"
