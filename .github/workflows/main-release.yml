# Versioning policy (nyuchi/.github#80): every release to `main` is the next
# MINOR (x.y.z -> x.(y+1).0); merges into `staging` are patches
# (staging-version.yml); a MAJOR is only ever made by hand, here, with
# workflow_dispatch and bump: major.
#
# Gated on CI: it runs after the `CI` workflow COMPLETES on `main` and only
# tags when it succeeded, so a red `main` gets no version. The version lives
# in tags only: nothing is committed back to `main`. The tag and release are
# pushed with the run's GITHUB_TOKEN, as the org's staging release does (the
# org RELEASE_BUMP_TOKEN is not used: nothing here listens for tag pushes, so
# a tag that starts no workflow is what we want). Copied from
# mukoko-dev/mukoko-circles .github/workflows/main-release.yml.
#
# Release notes (owner, 2026-11-04: "Every release should have release notes
# too with a changelog"): the CHANGELOG.md entries added since the previous
# main release plus a compare link, built before the tag is pushed (no entries
# fails the job and tags nothing) and set when the release is created as a
# draft, which is then published once. A published release is never edited.
name: Main release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: version-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag the next minor
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Check out trusted main, never the workflow_run's commit, and tag the
        # tested commit by SHA below. fetch-depth 0 makes that commit, and the
        # tags the release notes compare against, present.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the next version
        id: v
        uses: nyuchi/.github/.github/actions/next-version@c2e2506a4eadf67fbf824b41720aa220c539fc21  # main, 2026-10-19
        with:
          channel: main
          bump: ${{ inputs.bump || '' }}
          manual: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Push the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          head="$(git rev-parse --verify "${SHA}^{commit}")"
          # A commit that already carries a minor tag keeps it, and its release
          # is created if missing (publish-release.sh leaves a published one
          # alone: releases are immutable, so a re-run never rewrites notes).
          existing="$(git ls-remote --tags "$remote" 'refs/tags/v*' \
            | awk -v h="$head" '$1 == h && $2 ~ /\.0\^\{\}$/ { print $2; exit }')"
          existing="${existing#refs/tags/}"
          existing="${existing%^\{\}}"
          if [ -n "$existing" ]; then TAG="$existing"; fi
          # Release notes: the CHANGELOG.md entries added since the previous
          # main release, then a compare link. They are built BEFORE the tag is
          # pushed: release_notes.py exits 1 when there are no entries, so a
          # release with no changelog content fails here, tagging nothing.
          prev="$(git tag -l 'v*.*.0' --merged "$head" --sort=-v:refname | grep -Fvx "$TAG" | head -n 1 || true)"
          if [ -n "$prev" ]; then
            compare="https://github.com/${GH_REPO}/compare/${prev}...${TAG}"
          else
            compare="https://github.com/${GH_REPO}/commits/${TAG}"
          fi
          CHANGELOG_URL="https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md" COMPARE_URL="$compare" \
            python3 .github/scripts/release_notes.py "$prev" "$head" > "$RUNNER_TEMP/notes.md"
          if [ -z "$existing" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$head"
            git push "$remote" "refs/tags/$TAG"
          fi
          # Draft with the notes, then published once; never edited afterwards.
          bash .github/scripts/publish-release.sh "$TAG" "$TAG" "$RUNNER_TEMP/notes.md" latest
          echo "Released $TAG at $head." | tee -a "$GITHUB_STEP_SUMMARY"
